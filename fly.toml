# Deploy: fly launch --no-deploy --copy-config  →  fly volumes create funke_data --size 1 --region fra
#         fly secrets set ADMIN_TOKEN=$(openssl rand -hex 32)  →  fly deploy
app = "funke-CHANGE-ME"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/funke.db"
  COOKIE_SECURE = "1"
  TRUST_PROXY = "1"
  BASE_URL = "https://funke-CHANGE-ME.fly.dev"

[mounts]
  source = "funke_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
